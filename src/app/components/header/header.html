<nav class="navbar" [class.hidden]="isHeaderHidden">
  <div class="logo">
    <span class="gradient-text">RakeshReddy</span>
  </div>

  <ul class="nav-links" [class.mobile-open]="isMenuOpen">
    <li><a href="#hero" (click)="closeMenu()" [class.active]="isActive('hero')"><i class="fas fa-home"></i> Home</a></li>
    <li><a href="#education" (click)="closeMenu()" [class.active]="isActive('education')"><i class="fas fa-user-graduate"></i> Education</a></li>
    <li><a href="#certifications" (click)="closeMenu()" [class.active]="isActive('certifications')"><i class="fas fa-certificate"></i> Certs</a></li>
    <li><a href="#experience" (click)="closeMenu()" [class.active]="isActive('experience')"><i class="fas fa-briefcase"></i> Experience</a></li>
    <li><a href="#projects" (click)="closeMenu()" [class.active]="isActive('projects')"><i class="fas fa-code"></i> Projects</a></li>
    <li><a href="#games" (click)="closeMenu()" [class.active]="isActive('games')"><i class="fas fa-gamepad"></i> Games</a></li>
    <li><a href="#skills" (click)="closeMenu()" [class.active]="isActive('skills')"><i class="fas fa-tools"></i> Skills</a></li>
    <li><a href="#contact" (click)="closeMenu()" [class.active]="isActive('contact')"><i class="fas fa-envelope"></i> Contact</a></li>
  </ul>

  <div class="header-actions">
    <button class="theme-toggle" (click)="toggleTheme()" [attr.aria-label]="isDarkTheme ? 'Switch to Light Mode' : 'Switch to Dark Mode'">
      <i class="fas" [class.fa-moon]="isDarkTheme" [class.fa-sun]="!isDarkTheme"></i>
    </button>

    <div class="menu-btn" (click)="toggleMenu()" [class.open]="isMenuOpen">
      <div class="menu-btn__burger"></div>
    </div>
